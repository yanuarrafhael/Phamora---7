<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Data Obat - Pharmora</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<style>
  :root { --bg: #E6F8F5; --hijau-tua: #006B63; --tosca: #20BFA9; --putih: #FFFFFF; --oranye: #F26A1B; }
  * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  html, body { margin: 0; background: var(--bg); }
  body { zoom: 0.75; overflow-x: hidden; }
  .layout { display: flex; min-height: calc(100vh / 0.75); }
  .sidebar { min-height: 1024px; height: auto; }
  .konten { flex: 1; padding: 20px 40px 50px 27px; min-width: 0; }

  .atas { display: flex; gap: 16px; align-items: center; }
  .bar { position: relative; width: 760px; max-width: 100%; height: 34px; background: var(--putih); border-radius: 8px;
         display: flex; align-items: center; padding: 0 12px; gap: 10px; }
  .bar input { flex: 1; border: none; outline: none; font-size: 14px; color: #333; background: transparent; }
  .bar input::placeholder { color: #888; }
  .lonceng { cursor: pointer; border-radius: 6px; padding: 3px; display: flex; transition: background 200ms ease-out; }
  .lonceng:hover { background: #d8f3ee; }
  .notif { display: none; position: absolute; top: 42px; right: 0; width: 330px; background: var(--putih);
           border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); z-index: 5; overflow: hidden; }
  .notif.buka { display: block; }
  .notif div { padding: 12px 16px; font-size: 14px; font-weight: 500; color: var(--hijau-tua); border-bottom: 1px solid #e3f1ee; }
  .notif div:last-child { border-bottom: none; }
  .notif b { color: var(--oranye); }
  .tambah { height: 40px; padding: 0 22px; background: var(--hijau-tua); color: var(--putih); border-radius: 8px;
            display: flex; align-items: center; font-size: 16px; font-weight: 600; text-decoration: none;
            transition: background 200ms ease-out; white-space: nowrap; }
  .tambah:hover { background: var(--tosca); }

  .sapaan { margin: 60px 0 0 0; font-size: 36px; font-weight: 600; color: #000; }

  .kartu-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 33px; margin: 50px 0 0 0; }
  .stat { height: 143px; background: var(--putih); border: 3px solid #000; border-radius: 22px; padding: 20px 22px; cursor: pointer;
          transition: border-color 200ms ease-out, background 200ms ease-out; }
  .stat:hover { background: #f1fbf9; border-color: var(--hijau-tua); }
  .stat.aktif { border-color: var(--tosca); background: #f1fbf9; }
  .stat .judul { font-size: 12px; font-weight: 600; color: var(--tosca); }
  .stat .baris { margin: 14px 0 10px 12px; }
  .stat .angka { font-size: 28px; font-weight: 600; color: #000; }
  .stat .ket { font-size: 11px; font-weight: 600; color: var(--tosca); }

  .panel { background: var(--putih); margin: 50px 0 0 0; padding: 20px 22px 24px; width: 100%; display: flex; flex-direction: column; }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--bg); color: var(--hijau-tua); font-size: 15px; font-weight: 600; text-align: left; height: 46px; padding: 0 8px; border-bottom: 2px solid #777; }
  td { color: var(--hijau-tua); font-size: 15px; font-weight: 600; height: 46px; padding: 0 8px; border-bottom: 1px solid #777; }
  tbody tr { transition: background 200ms ease-out; }
  tbody tr:hover { background: #f1fbf9; }
  .habis { color: #c0392b; }
  .mau { color: var(--oranye); }
  .aksi { white-space: nowrap; }
  .aksi svg { width: 26px; height: 26px; margin-right: 6px; cursor: pointer; vertical-align: middle; border-radius: 6px; padding: 3px; transition: background 200ms ease-out; }
  .aksi svg:hover { background: #d8f3ee; }
  .kosong { text-align: center; }

  .halaman { margin-top: 24px; display: flex; gap: 10px; justify-content: flex-end; }
  .halaman button { width: 48px; height: 48px; background: var(--putih); border: 1px solid var(--tosca); border-radius: 10px;
                    color: var(--hijau-tua); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
                    transition: background 200ms ease-out, color 200ms ease-out; }
  .halaman button:hover { background: var(--tosca); color: var(--putih); }
  .halaman button svg { width: 20px; height: 20px; }

  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
  #popup { background: var(--bg); color: var(--hijau-tua); width: 436px; height: 315px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; cursor: pointer; }
  .ikon { width: 90px; height: 90px; border-radius: 50%; background: var(--hijau-tua); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
  .ikon.polos { background: transparent; border-radius: 0; }
  #pesan { font-size: 24px; font-weight: 600; margin: 0; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="konten">
    <div class="atas">
      <div class="bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M15 15 L21 21"/></svg>
        <input id="cari" placeholder="Cari obat..." oninput="halaman = 1; tampil()">
        <div class="lonceng" onclick="toggleNotif()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 0 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>
        </div>
        <div class="notif" id="notif"></div>
      </div>
      <a class="tambah" href="obat.html">+ Tambah Obat</a>
    </div>

    <div class="sapaan">Selamat Datang, Haechan Lee</div>

    <div class="kartu-row">
      <div class="stat" id="k-semua" onclick="pilih('semua')">
        <div class="judul">Total Obat</div>
        <div class="baris"><div class="angka" id="n-semua">0</div></div>
        <div class="ket">+ 1 bulan lalu</div>
      </div>
      <div class="stat" id="k-menipis" onclick="pilih('menipis')">
        <div class="judul">Stok menipis</div>
        <div class="baris"><div class="angka" id="n-menipis">0</div></div>
        <div class="ket">Perlu Perhatian</div>
      </div>
      <div class="stat" id="k-kedaluwarsa" onclick="pilih('kedaluwarsa')">
        <div class="judul">Mau Kadaluwarsa</div>
        <div class="baris"><div class="angka" id="n-kedaluwarsa">0</div></div>
        <div class="ket">Perlu Restok</div>
      </div>
      <div class="stat" onclick="location.href='menuresep.html'">
        <div class="judul">Total Resep</div>
        <div class="baris"><div class="angka" id="n-resep">0</div></div>
        <div class="ket" id="ket-resep">Memuat...</div>
      </div>
    </div>

    <section class="panel">
      <table>
        <thead>
          <tr>
            <th style="width:4%">NO</th><th style="width:16%">Nama Obat</th><th style="width:11%">Kategori</th>
            <th style="width:6%">Stok</th><th style="width:11%">Status</th><th style="width:15%">Tanggal Obat Masuk</th>
            <th style="width:15%">Tanggal Obat Keluar</th><th style="width:13%">Tanggal Obat EXP</th><th style="width:9%">Aksi</th>
          </tr>
        </thead>
        <tbody id="isi"><tr><td colspan="9" class="kosong">Memuat data...</td></tr></tbody>
      </table>
      <div class="halaman" id="halaman"></div>
    </section>
  </main>
</div>

<div id="overlay" onclick="tutupPopup()">
  <div id="popup">
    <div class="ikon" id="ikon"></div>
    <p id="pesan"></p>
  </div>
</div>

<script src="sidebar.js"></script>
<script>
const API = "http://localhost:8081/api/obat";
const PER_HALAMAN = 10;
const BATAS_MENIPIS = 30;
const BATAS_HARI = 90;
let semua = [], resep = [];
let halaman = parseInt(sessionStorage.getItem("halamanObat") || "1", 10);
let filter = "semua";
let timerPopup = null;

const IKON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="#20BFA9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>`;
const IKON_HAPUS = `<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6l1 15h12l1-15"/><path d="M10 11v6M14 11v6"/></svg>`;
const POPUP_SILANG = `<svg width="50" height="50" viewBox="0 0 48 48" fill="none"><path d="M10 10 L38 38 M38 10 L10 38" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square"/></svg>`;
const POPUP_SAMPAH = `<svg width="90" height="90" viewBox="0 0 90 90" fill="none" stroke="#006B63" stroke-width="7" stroke-linejoin="round"><path d="M12 22 H78"/><rect x="34" y="10" width="22" height="12"/><path d="M18 22 V80 H72 V22"/><path d="M36 38 V64 M54 38 V64"/></svg>`;
const PANAH_KIRI = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
const PANAH_KANAN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`;

function sisaHari(o) {
  if (!o.TglExpiredIso) return null;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  return Math.round((new Date(o.TglExpiredIso + "T00:00:00") - now) / 86400000);
}
const habis      = o => o.Stok === 0;
const menipis    = o => o.Stok <= BATAS_MENIPIS;
const hampir     = o => { const s = sisaHari(o); return s !== null && s <= BATAS_HARI; };
const sudahLewat = o => { const s = sisaHari(o); return s !== null && s < 0; };

function statusObat(o) {
  if (habis(o)) return ["Habis", "habis"];
  if (sudahLewat(o)) return ["Kedaluwarsa", "habis"];
  if (hampir(o)) return ["Mau kedaluwarsa", "mau"];
  return ["Tersedia", ""];
}

async function muat() {
  try {
    semua = await (await fetch(API)).json();
  } catch (e) {
    document.getElementById("isi").innerHTML = '<tr><td colspan="9" class="kosong">Gagal memuat data obat</td></tr>';
    return;
  }
  try { resep = await (await fetch("http://localhost:8081/api/resep")).json(); } catch (e) { resep = []; }
  hitungKartu();
  tampil();
}

function hitungKartu() {
  const belum = resep.filter(r => (r.Status || "").toLowerCase() === "belum").length;
  const lewat = semua.filter(sudahLewat).length;
  const segera = semua.filter(hampir).length - lewat;
  document.getElementById("n-semua").textContent       = semua.length;
  document.getElementById("n-menipis").textContent     = semua.filter(menipis).length;
  document.getElementById("n-kedaluwarsa").textContent = semua.filter(hampir).length;
  document.getElementById("n-resep").textContent       = resep.length;
  document.getElementById("ket-resep").textContent     = belum + " Belum Selesai";
  document.getElementById("notif").innerHTML = `
    <div><b>${semua.filter(menipis).length} obat</b> stok menipis</div>
    <div><b>${lewat} obat</b> sudah kedaluwarsa</div>
    <div><b>${segera} obat</b> akan kedaluwarsa dalam ${BATAS_HARI} hari</div>
    <div><b>${belum} resep</b> belum selesai</div>`;
}

function pilih(jenis) {
  filter = (filter === jenis && jenis !== "semua") ? "semua" : jenis;
  ["semua", "menipis", "kedaluwarsa"].forEach(j =>
    document.getElementById("k-" + j).classList.toggle("aktif", filter === j && filter !== "semua"));
  halaman = 1;
  tampil();
}

function tampil() {
  const kata = document.getElementById("cari").value.trim().toLowerCase();
  const hasil = semua.filter(o => {
    const cocokNama = (" " + o.NamaObat.toLowerCase()).includes(" " + kata);
    const cocokFilter = filter === "semua" ? true : filter === "menipis" ? menipis(o) : hampir(o);
    return cocokNama && cocokFilter;
  });
  const totalHal = Math.max(1, Math.ceil(hasil.length / PER_HALAMAN));
  if (halaman > totalHal) halaman = totalHal;
  if (halaman < 1) halaman = 1;
  sessionStorage.setItem("halamanObat", halaman);

  const mulai = (halaman - 1) * PER_HALAMAN;
  const tbody = document.getElementById("isi");
  tbody.innerHTML = "";
  if (hasil.length === 0) tbody.innerHTML = '<tr><td colspan="9" class="kosong">Data tidak ditemukan</td></tr>';

  hasil.slice(mulai, mulai + PER_HALAMAN).forEach((o, i) => {
    const st = statusObat(o);
    const tr = document.createElement("tr");
    [mulai + i + 1, o.NamaObat, o.NamaKategori, o.Stok, st[0], o.TglMasuk || "-", o.TglKeluar || "-", o.TglExpired || "-"]
      .forEach((n, k) => {
        const td = document.createElement("td");
        td.textContent = n;
        if (k === 4) td.className = st[1];
        tr.appendChild(td);
      });
    const aksi = document.createElement("td");
    aksi.className = "aksi";
    aksi.innerHTML = IKON_EDIT + IKON_HAPUS;
    aksi.querySelectorAll("svg")[0].onclick = () => { location.href = "obat.html?id=" + encodeURIComponent(o.IdObat); };
    aksi.querySelectorAll("svg")[1].onclick = () => hapus(o.IdObat);
    tr.appendChild(aksi);
    tbody.appendChild(tr);
  });

  const box = document.getElementById("halaman");
  box.innerHTML = "";
  if (halaman > 1) box.appendChild(tombol(PANAH_KIRI, () => { halaman--; tampil(); }));
  box.appendChild(tombol(String(halaman), () => {}));
  if (halaman < totalHal) box.appendChild(tombol(PANAH_KANAN, () => { halaman++; tampil(); }));
}

function tombol(isi, aksi) {
  const b = document.createElement("button");
  b.innerHTML = isi;
  b.onclick = aksi;
  return b;
}

async function hapus(id) {
  try {
    const res = await fetch(API + "/" + encodeURIComponent(id), { method: "DELETE" });
    const hasil = await res.json();
    if (res.ok) {
      tampilPopup("Data Berhasil Dihapus", "hapus");
      await muat();
      timerPopup = setTimeout(tutupPopup, 2000);
    } else {
      tampilPopup(hasil.pesan, "gagal");
    }
  } catch (e) {
    tampilPopup("Tidak dapat terhubung ke server", "gagal");
  }
}

function tampilPopup(teks, jenis) {
  clearTimeout(timerPopup);
  const ikon = document.getElementById("ikon");
  ikon.className = "ikon" + (jenis === "hapus" ? " polos" : "");
  ikon.innerHTML = jenis === "hapus" ? POPUP_SAMPAH : POPUP_SILANG;
  document.getElementById("pesan").innerText = teks;
  document.getElementById("overlay").style.display = "flex";
}
function tutupPopup() {
  clearTimeout(timerPopup);
  document.getElementById("overlay").style.display = "none";
}

function toggleNotif() { document.getElementById("notif").classList.toggle("buka"); }
document.addEventListener("click", e => {
  if (!e.target.closest(".lonceng") && !e.target.closest(".notif")) {
    document.getElementById("notif").classList.remove("buka");
  }
});

muat();
</script>
</body>
</html>
