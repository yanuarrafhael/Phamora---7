<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Data Kategori - Pharmora</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidebar.css">
<style>
  :root { --bg: #E6F8F5; --hijau-tua: #006B63; --tosca: #20BFA9; --putih: #FFFFFF; --oranye: #F26A1B; }
  * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  html, body { margin: 0; background: var(--bg); }
  body { zoom: 0.75; overflow-x: hidden; }
  .layout { display: flex; height: calc(100vh / 0.75); min-height: 900px; }

  .konten { flex: 1; padding: 35px 40px 50px 27px; min-width: 0; }

  .atas { display: flex; justify-content: space-between; align-items: center; }
  .sapaan { margin: 0; font-size: 36px; font-weight: 600; color: #000; }
  .tambah { width: 231px; height: 50px; background: var(--hijau-tua); color: var(--putih); border: none; border-radius: 8px;
            font-size: 20px; font-weight: 600; cursor: pointer; transition: background 200ms ease-out; }
  .tambah:hover { background: var(--tosca); }

  .kartu { background: var(--putih); border-radius: 14px; margin-top: 18px; overflow: hidden; }
  .cari-baris { display: flex; gap: 14px; padding: 15px 18px; align-items: center; border-bottom: 1px solid #e3f1ee; }
  .cari-kotak { flex: 1; height: 50px; border: 1px solid #e3f1ee; border-radius: 8px; display: flex; align-items: center; gap: 12px; padding: 0 12px; }
  .cari-kotak input { flex: 1; border: none; outline: none; font-size: 20px; color: #444; background: transparent; }
  .cari-kotak input::placeholder { color: #777; }
  .tombol-cari { width: 65px; height: 50px; border: 1px solid #e3f1ee; background: var(--putih); border-radius: 8px; cursor: pointer;
                 display: flex; align-items: center; justify-content: center; transition: background 200ms ease-out; }
  .tombol-cari:hover { background: #e6f8f5; }

  table { width: 100%; border-collapse: collapse; }
  th { background: var(--bg); color: #5f7f7a; font-size: 20px; font-weight: 600; text-align: left; height: 51px; padding: 0 10px; }
  td { color: #222; font-size: 20px; height: 72px; padding: 0 10px; border-bottom: 2px solid #dff1ee; }
  th.kanan, td.kanan { text-align: right; }
  tbody tr { transition: background 200ms ease-out; }
  tbody tr:hover { background: #f7fcfb; }
  .aksi { white-space: nowrap; text-align: right; }
  .aksi svg { width: 28px; height: 28px; margin-left: 8px; cursor: pointer; vertical-align: middle; border-radius: 6px; padding: 3px; transition: background 200ms ease-out; }
  .aksi svg:hover { background: #d8f3ee; }
  .kosong { text-align: center; color: #777; }

  .halaman { display: flex; gap: 10px; justify-content: flex-end; padding: 18px 40px 24px; }
  .halaman button { width: 40px; height: 40px; background: var(--putih); border: 1px solid #dff1ee; border-radius: 8px;
                    color: #222; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
                    transition: background 200ms ease-out, color 200ms ease-out; }
  .halaman button:hover { background: var(--tosca); color: var(--putih); }
  .halaman button svg { width: 16px; height: 16px; }

  /* Popup */
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 10; }
  #popup { background: var(--bg); color: var(--hijau-tua); width: 436px; height: 315px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; cursor: pointer; }
  .ikon { width: 90px; height: 90px; border-radius: 50%; background: var(--hijau-tua); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
  .ikon.polos { background: transparent; border-radius: 0; }
  #pesan { font-size: 24px; font-weight: 600; margin: 0; }

  /* Popup form tambah/edit */
  #overlayForm { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 9; }
  #kotakForm { background: var(--bg); width: 520px; padding: 32px; border-radius: 12px; }
  #kotakForm h2 { margin: 0 0 20px; color: var(--hijau-tua); font-size: 28px; }
  #kotakForm label { display: block; color: var(--hijau-tua); font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  #kotakForm input { width: 100%; height: 60px; border: none; border-radius: 8px; padding: 0 15px; font-size: 18px; color: var(--hijau-tua); background: var(--putih); }
  #kotakForm input::placeholder { color: var(--tosca); opacity: 1; }
  #kotakForm input:focus { outline: 2px solid var(--tosca); }
  .tombol-form { display: flex; gap: 16px; margin-top: 24px; justify-content: flex-end; }
  .tombol-form button { width: 150px; height: 46px; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; transition: background 200ms ease-out; }
  .btn-batal { background: var(--putih); color: var(--tosca); }
  .btn-batal:hover { background: #cfeee9; }
  .btn-simpan { background: var(--tosca); color: var(--putih); }
  .btn-simpan:hover { background: var(--hijau-tua); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="konten">
    <div class="atas">
      <h1 class="sapaan">Selamat Datang, Haechan Lee</h1>
      <button class="tambah" onclick="bukaForm()">+ &nbsp;Tambah Kategori</button>
    </div>

    <section class="kartu">
      <div class="cari-baris">
        <div class="cari-kotak">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M15 15 L21 21"/></svg>
          <input id="cari" placeholder="Cari Kategori..." oninput="halaman = 1; tampil()">
        </div>
        <button class="tombol-cari" onclick="halaman = 1; tampil()">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#006B63" stroke-width="2.8" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M15 15 L21 21"/></svg>
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width:8%">No</th>
            <th>Nama Kategori</th>
            <th class="kanan" style="width:20%">Jumlah Obat</th>
            <th class="kanan" style="width:12%">Aksi</th>
          </tr>
        </thead>
        <tbody id="isi"></tbody>
      </table>

      <div class="halaman" id="halaman"></div>
    </section>
  </main>
</div>

<div id="overlay" onclick="tutupPopup()">
  <div id="popup"><div class="ikon" id="ikon"></div><p id="pesan"></p></div>
</div>

<div id="overlayForm">
  <div id="kotakForm">
    <h2 id="judulForm">Tambah Kategori</h2>
    <label for="namaKat">Nama Kategori</label>
    <input id="namaKat" placeholder="Masukan nama kategori" autocomplete="off">
    <div class="tombol-form">
      <button class="btn-batal" onclick="tutupForm()">Batal</button>
      <button class="btn-simpan" onclick="simpanForm()">Simpan</button>
    </div>
  </div>
</div>

<script src="sidebar.js"></script>
<script>
const PER_HALAMAN = 8;
let semua = [
  { id: 1, nama: "Analgesik", jumlah: 67 },
  { id: 2, nama: "Antibiotik", jumlah: 99 },
  { id: 3, nama: "Vitamin dan suplemen", jumlah: 56 },
  { id: 4, nama: "Antasida", jumlah: 60 },
  { id: 5, nama: "Obat Kulit", jumlah: 40 },
  { id: 6, nama: "Antijamur dan Antivirus", jumlah: 38 },
  { id: 7, nama: "Bronkodilator", jumlah: 12 },
  { id: 8, nama: "Obat Topikal", jumlah: 11 }
];
let halaman = 1, timerPopup = null, idEdit = null, nomorBaru = 9;

const IKON_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="#20BFA9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>`;
const IKON_HAPUS = `<svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6l1 15h12l1-15"/><path d="M10 11v6M14 11v6"/></svg>`;
const POPUP_CENTANG = `<svg width="50" height="50" viewBox="0 0 48 48" fill="none"><path d="M8 25 L19 36 L40 13" stroke="#FFFFFF" stroke-width="5" stroke-linecap="square"/></svg>`;
const POPUP_SILANG = `<svg width="50" height="50" viewBox="0 0 48 48" fill="none"><path d="M10 10 L38 38 M38 10 L10 38" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square"/></svg>`;
const POPUP_SAMPAH = `<svg width="90" height="90" viewBox="0 0 90 90" fill="none" stroke="#006B63" stroke-width="7" stroke-linejoin="round"><path d="M12 22 H78"/><rect x="34" y="10" width="22" height="12"/><path d="M18 22 V80 H72 V22"/><path d="M36 38 V64 M54 38 V64"/></svg>`;
const PANAH_KIRI = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
const PANAH_KANAN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`;

function tampil() {
  const kata = document.getElementById("cari").value.trim().toLowerCase();
  const hasil = semua.filter(k => (" " + k.nama.toLowerCase()).includes(" " + kata));
  const total = Math.max(1, Math.ceil(hasil.length / PER_HALAMAN));
  if (halaman > total) halaman = total;
  if (halaman < 1) halaman = 1;

  const mulai = (halaman - 1) * PER_HALAMAN;
  const tbody = document.getElementById("isi");
  tbody.innerHTML = hasil.length ? "" : '<tr><td colspan="4" class="kosong">Data tidak ditemukan</td></tr>';

  hasil.slice(mulai, mulai + PER_HALAMAN).forEach((k, i) => {
    const tr = document.createElement("tr");
    [mulai + i + 1, k.nama, k.jumlah].forEach((n, c) => {
      const td = document.createElement("td");
      td.textContent = n;
      if (c === 2) td.className = "kanan";
      tr.appendChild(td);
    });
    const aksi = document.createElement("td");
    aksi.className = "aksi";
    aksi.innerHTML = IKON_EDIT + IKON_HAPUS;
    aksi.querySelectorAll("svg")[0].onclick = () => bukaForm(k.id);
    aksi.querySelectorAll("svg")[1].onclick = () => hapus(k.id);
    tr.appendChild(aksi);
    tbody.appendChild(tr);
  });

  const box = document.getElementById("halaman");
  box.innerHTML = "";
  if (halaman > 1) box.appendChild(tombol(PANAH_KIRI, () => { halaman--; tampil(); }));
  box.appendChild(tombol(String(halaman), () => {}));
  if (halaman < total) box.appendChild(tombol(PANAH_KANAN, () => { halaman++; tampil(); }));
}

function tombol(isi, aksi) {
  const b = document.createElement("button");
  b.innerHTML = isi; b.onclick = aksi;
  return b;
}

/* Form tambah/edit (popup) */
function bukaForm(id) {
  idEdit = id || null;
  const k = semua.find(x => x.id === id);
  document.getElementById("judulForm").textContent = k ? "Edit Kategori" : "Tambah Kategori";
  document.getElementById("namaKat").value = k ? k.nama : "";
  document.getElementById("overlayForm").style.display = "flex";
  document.getElementById("namaKat").focus();
}
function tutupForm() { document.getElementById("overlayForm").style.display = "none"; }

function simpanForm() {
  const nama = document.getElementById("namaKat").value.trim();
  if (!nama) { tutupForm(); tampilPopup("Lengkapi Data Terlebih Dahulu", "gagal"); return; }
  if (semua.some(k => k.nama.toLowerCase() === nama.toLowerCase() && k.id !== idEdit)) {
    tutupForm(); tampilPopup("Kategori sudah terdaftar", "gagal"); return;
  }
  if (idEdit) {
    semua.find(k => k.id === idEdit).nama = nama;
    tutupForm(); tampilPopup("Data berhasil Diubah", "sukses");
  } else {
    semua.push({ id: nomorBaru++, nama, jumlah: 0 });
    halaman = 9999;
    tutupForm(); tampilPopup("Data berhasil Ditambahkan", "sukses");
  }
  tampil();
  timerPopup = setTimeout(tutupPopup, 2000);
}

function hapus(id) {
  semua = semua.filter(k => k.id !== id);
  tampil();
  tampilPopup("Data Berhasil Dihapus", "hapus");
  timerPopup = setTimeout(tutupPopup, 2000);
}

function tampilPopup(teks, jenis) {
  clearTimeout(timerPopup);
  const ikon = document.getElementById("ikon");
  ikon.className = "ikon" + (jenis === "hapus" ? " polos" : "");
  ikon.innerHTML = jenis === "hapus" ? POPUP_SAMPAH : jenis === "gagal" ? POPUP_SILANG : POPUP_CENTANG;
  document.getElementById("pesan").innerText = teks;
  document.getElementById("overlay").style.display = "flex";
}
function tutupPopup() { clearTimeout(timerPopup); document.getElementById("overlay").style.display = "none"; }

tampil();
</script>
</body>
</html>
