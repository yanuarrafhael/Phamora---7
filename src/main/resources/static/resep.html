<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tambah Resep - Pharmora</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<style>
  :root {
    --bg: #E6F8F5;
    --hijau-tua: #006B63;
    --tosca: #20BFA9;
    --putih: #FFFFFF;
  }
  * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
  body { margin: 0; background: var(--bg); min-height: 100vh; zoom: 0.75; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 30px 0;
  }
  header img { width: 223px; height: 68px; display: block; }
  .kembali { color: var(--tosca); font-weight: 500; font-size: 20px; text-decoration: none; transition: color 200ms ease-out; }
  .kembali:hover { color: var(--hijau-tua); }

  main { padding: 0 44px; }
  h1 { color: var(--hijau-tua); font-size: 32px; font-weight: 600; margin: 20px 0 40px; }

  form { margin-left: 22px; }
    .isi { display: flex; justify-content: space-between; align-items: flex-start; }
  .kiri { width: 591px; flex-shrink: 0; }
    .kanan { width: 740px; margin-top: -30px; padding-top: 22px; margin-right: 60px; }

  label {
    display: block; color: var(--hijau-tua);
    font-size: 20px; font-weight: 600; line-height: 28px;
    margin-bottom: 27px;
  }
    .kiri input {
    display: block; width: 591px; height: 73px;
    padding: 0 15px; border: none; border-radius: 8px;
    background: var(--putih); color: var(--hijau-tua);
    font-size: 20px; font-weight: 500;
    margin: 0 0 27px;
  }
  .kiri input::placeholder { color: #20BFA9 !important; opacity: 1; }
  .kiri input::-webkit-input-placeholder { color: #20BFA9 !important; opacity: 1; }
  .kiri input:focus { outline: 2px solid var(--tosca); }
  /* ===== Dropdown Status ===== */
  .dropdown { position: relative; width: 591px; margin: 0 0 27px; }
  .dropdown-kotak {
    height: 73px; padding: 0 20px 0 15px;
    background: var(--putih); border-radius: 8px;
    display: flex; align-items: center; justify-content: space-between;
    color: var(--tosca); font-size: 20px; font-weight: 600;
    cursor: pointer; user-select: none;
  }
  .dropdown.buka .dropdown-kotak { border-radius: 8px 8px 0 0; }
  .dropdown-panah {
    width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 7px solid var(--tosca);
  }
  .dropdown-daftar {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    background: var(--putih); z-index: 5;
  }
  .dropdown.buka .dropdown-daftar { display: block; }
  .pilihan {
    height: 73px; padding: 0 15px;
    display: flex; align-items: center;
    color: var(--tosca); font-size: 20px; font-weight: 600;
    cursor: pointer; transition: background 200ms ease-out;
  }


  /* ===== Tabel obat ===== */
  table { width: 100%; border-collapse: collapse; }
  th {
    color: var(--tosca); font-size: 16px; font-weight: 600;
    text-align: left; padding: 12px 10px;
    border-bottom: 2px solid #888;
  }
  td {
    background: var(--putih); color: var(--hijau-tua);
    font-size: 18px; font-weight: 600;
    padding: 18px 10px; border-bottom: 1px solid var(--tosca);
  }
  td input {
    width: 90px; height: 40px; padding: 0 12px;
    border: 1px solid var(--tosca); border-radius: 6px;
    font-size: 18px; font-weight: 600; color: var(--hijau-tua);
    background: var(--putih);
  }

  .tombol { display: flex; gap: 29px; margin: 60px 0 40px 44px; }
  .tombol button {
    width: 231px; height: 50px; border: none; border-radius: 8px;
    font-size: 20px; font-weight: 600; cursor: pointer;
    transition: background 200ms ease-out;
  }
  .batal { background: var(--putih); color: var(--tosca); }
  .simpan { background: var(--tosca); color: var(--putih); }
  .simpan:hover { background: var(--hijau-tua); }
  .batal:hover { background: #cfeee9; }

  /* Popup */
  #overlay {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,0.5);
    justify-content: center; align-items: center;
  }
  #popup {
    background: var(--bg); color: var(--hijau-tua);
    width: 436px; height: 315px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center; cursor: pointer;
  }
  .ikon {
    width: 90px; height: 90px; border-radius: 50%; background: var(--hijau-tua);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  #pesan { font-size: 24px; font-weight: 600; margin: 0; color: var(--hijau-tua); }
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Pharmora">
  <a href="menuresep.html" class="kembali">← Kembali</a>
</header>

<main>
  <h1>Tambah Resep</h1>
  <form id="formResep" autocomplete="off">
    <div class="isi">
      <div class="kiri">
        <label for="nama">Nama Pasien</label>
        <input id="nama" placeholder="Masukan nama pasien">

        <label for="tgl">Tanggal Resep</label>
        <input id="tgl" placeholder="yyyy/mm/dd">

        <label>Status</label>
        <div class="dropdown" id="dropStatus">
          <div class="dropdown-kotak" id="dropKotak">
            <span id="dropTeks">Pilih Status</span>
            <i class="dropdown-panah"></i>
          </div>
          <div class="dropdown-daftar">
            <div class="pilihan" data-nilai="Belum">Belum</div>
            <div class="pilihan" data-nilai="Selesai">Selesai</div>
          </div>
        </div>
      </div>

      <div class="kanan">
        <table>
          <thead>
            <tr>
              <th style="width:12%">NO</th>
              <th style="width:38%">Nama Obat</th>
              <th style="width:17%">Stok</th>
              <th style="width:33%">Jumlah Keluar</th>
            </tr>
          </thead>
          <tbody id="isiObat">
            <tr><td colspan="4">Memuat data obat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="tombol">
      <button type="button" class="batal" onclick="document.getElementById('formResep').reset(); location.href='menuresep.html'">Batal</button>
      <button type="button" class="simpan" onclick="simpan()">Simpan</button>
    </div>
  </form>
</main>

<!-- Popup -->
<div id="overlay" onclick="tutupPopup()">
  <div id="popup">
    <div class="ikon" id="ikon"></div>
    <p id="pesan"></p>
  </div>
</div>

<script>
const API = "http://localhost:8081/api/resep";

const IKON_CENTANG = `
  <svg width="50" height="50" viewBox="0 0 48 48" fill="none">
    <path d="M8 25 L19 36 L40 13" stroke="#FFFFFF" stroke-width="5"
          stroke-linecap="square" stroke-linejoin="miter"/>
  </svg>`;

const IKON_SILANG = `
  <svg width="50" height="50" viewBox="0 0 48 48" fill="none">
    <path d="M10 10 L38 38 M38 10 L10 38" stroke="#FFFFFF" stroke-width="7"
          stroke-linecap="square"/>
  </svg>`;

// ===== Dropdown Status =====
let statusDipilih = "";
const dropdown = document.getElementById("dropStatus");
const dropTeks = document.getElementById("dropTeks");

document.getElementById("dropKotak").addEventListener("click", function (e) {
  e.stopPropagation();
  dropdown.classList.toggle("buka");
});

dropdown.querySelectorAll(".pilihan").forEach(function (el) {
  el.addEventListener("click", function (e) {
    e.stopPropagation();
    statusDipilih = el.dataset.nilai;
    dropTeks.textContent = el.dataset.nilai;
    dropdown.classList.remove("buka");
  });
});

document.addEventListener("click", function () {
  dropdown.classList.remove("buka");
});

function resetStatus() {
  statusDipilih = "";
  dropTeks.textContent = "Pilih Status";
}

// ===== Data obat =====
async function muatObat() {
  const tbody = document.getElementById("isiObat");
  try {
    const res = await fetch(API + "/obat");
    const daftar = await res.json();
    tbody.innerHTML = "";
    daftar.forEach((o, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${o.NamaObat}</td>
        <td>${o.Stok}</td>
        <td><input class="jumlah" data-id="${o.IdObat}" value="0"></td>`;
      tbody.appendChild(tr);
    });
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="4">Gagal memuat data obat</td></tr>';
  }
}

async function simpan() {
  const data = {
    nama: document.getElementById("nama").value.trim(),
    tglResep: document.getElementById("tgl").value.trim(),
    status: statusDipilih,
    obat: Array.from(document.querySelectorAll(".jumlah")).map(el => ({
      idObat: el.dataset.id,
      jumlah: el.value.trim()
    }))
  };

  // 1. Cek kolom utama kosong dulu
  if (!data.nama || !data.tglResep || !data.status) {
    tampilPopup("Lengkapi Data Terlebih Dahulu", false);
    return;
  }

  // 2. Kirim ke backend Java
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    const hasil = await res.json();

    if (res.ok) {
      tampilPopup("Data berhasil Ditambahkan", true);
      document.getElementById("formResep").reset();
      resetStatus();
      muatObat();
      setTimeout(() => {
        sessionStorage.setItem("halamanResep", "9999");
        location.href = "menuresep.html";
      }, 3000);
    } else {
      tampilPopup(hasil.pesan, false);
    }
  } catch (e) {
    tampilPopup("Tidak dapat terhubung ke server", false);
  }
}

function tampilPopup(teks, sukses) {
  document.getElementById("ikon").innerHTML = sukses ? IKON_CENTANG : IKON_SILANG;
  document.getElementById("pesan").innerText = teks;
  document.getElementById("overlay").style.display = "flex";
}

function tutupPopup() {
  document.getElementById("overlay").style.display = "none";
}

muatObat();
document.documentElement.setAttribute("data-tema", "gelap")
</script>
</body>
</html>
